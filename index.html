<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>حاسبة النسب - تليجرام</title>
  <!-- مكتبة تلجرام الرسمية لتتفاعل مع التطبيق مباشرة -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- مكتبة Tailwind CSS للتصميم العصري -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- خط تجوال العربي للأناقة -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #17212b; /* لون خلفية تليجرام الداكن */
      color: #f5f5f5;
    }
    .tg-card {
      background-color: #242f3d; /* لون كروت تليجرام */
      border: 1px solid #2b394a;
    }
    .tg-input {
      background-color: #17212b;
      border: 1px solid #2b394a;
      color: #ffffff;
    }
    .tg-input:focus {
      border-color: #64b5ef;
      outline: none;
    }
    .tg-btn {
      background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
      box-shadow: 0 4px 15px rgba(34, 158, 217, 0.3);
    }
    .tg-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 selection:bg-sky-500 selection:text-white">

  <!-- الكارت الرئيسي للتطبيق -->
  <div class="w-full max-w-md mx-auto space-y-5 mt-2">
    
    <!-- الهيدر -->
    <div class="text-center space-y-1">
      <div class="inline-block p-3 bg-sky-500/10 rounded-full mb-1">
        <svg class="w-8 h-8 text-[#64b5ef] mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-white">حاسبة النسب التجريبية</h1>
      <p class="text-xs text-gray-400">واجهة تفاعلية تجريبية داخل تليجرام 🚀</p>
    </div>

    <!-- كارت الإدخال -->
    <div class="tg-card rounded-2xl p-5 space-y-4 shadow-xl">
      
      <!-- حقل المبلغ -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-gray-300">المبلغ الأساسي (ر.س)</label>
        <div class="relative">
          <input type="number" id="amount" placeholder="مثال: 1000" 
                 class="tg-input w-full p-3.5 rounded-xl text-lg font-bold transition-all placeholder-gray-500 text-left dir-ltr">
          <span class="absolute left-3 top-3.5 text-xs text-gray-400 pointer-events-none">ر.س</span>
        </div>
      </div>

      <!-- حقل النسبة -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-gray-300">النسبة المئوية (%)</label>
        <div class="relative">
          <input type="number" id="percentage" placeholder="مثال: 15" 
                 class="tg-input w-full p-3.5 rounded-xl text-lg font-bold transition-all placeholder-gray-500 text-left dir-ltr">
          <span class="absolute left-3 top-3.5 text-xs text-gray-400 pointer-events-none">%</span>
        </div>
      </div>

      <!-- خيارات سريعة للنسبة -->
      <div class="flex gap-2 pt-1">
        <button onclick="setPercent(5)" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-sky-400 border border-slate-700 hover:bg-slate-700 transition">5%</button>
        <button onclick="setPercent(10)" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-sky-400 border border-slate-700 hover:bg-slate-700 transition">10%</button>
        <button onclick="setPercent(15)" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-sky-400 border border-slate-700 hover:bg-slate-700 transition">15%</button>
        <button onclick="setPercent(20)" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-sky-400 border border-slate-700 hover:bg-slate-700 transition">20%</button>
      </div>

      <!-- زر الحساب -->
      <button onclick="calculate()" class="tg-btn w-full py-3.5 rounded-xl font-bold text-white text-base transition-all mt-2 flex items-center justify-center gap-2">
        <span>احسب الآن</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
        </svg>
      </button>

    </div>

    <!-- كارت النتيجة -->
    <div id="resultCard" class="tg-card rounded-2xl p-5 space-y-3 shadow-xl hidden animate-fade-in border-sky-500/30">
      <div class="text-xs text-sky-400 font-bold uppercase tracking-wider text-center">النتيجة الحسابية</div>
      
      <div class="flex justify-between items-center py-2 border-b border-gray-700/50">
        <span class="text-sm text-gray-400">قيمة النسبة المضافة:</span>
        <span id="addedValue" class="text-base font-bold text-amber-400">0.00 ر.س</span>
      </div>

      <div class="flex justify-between items-center py-2">
        <span class="text-sm text-gray-200 font-semibold">الإجمالي النهائي:</span>
        <span id="totalValue" class="text-xl font-extrabold text-emerald-400">0.00 ر.س</span>
      </div>

      <!-- زر اختياري لإرسال النتيجة للبوت -->
      <button onclick="sendDataToTelegram()" class="w-full py-2.5 rounded-xl text-xs font-semibold bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-600/30 transition mt-2">
        إرسال النتيجة للبوت وإغلاق 📤
      </button>
    </div>

  </div>

  <!-- فوتر بسيط -->
  <div class="text-center text-[10px] text-gray-500 py-2">
    جاهز للتجربة في المتصفح أو داخل تليجرام ✨
  </div>

  <script>
    // تهيئة كائن تليجرام عند الفتح داخل التطبيق
    let tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand(); // إجبار تليجرام على فتح النافذة كاملة
    }

    // تعيين نسبة سريعة
    function setPercent(val) {
      document.getElementById('percentage').value = val;
      calculate();
    }

    // دالة الحساب الرئيسية
    function calculate() {
      const amount = parseFloat(document.getElementById('amount').value);
      const percentage = parseFloat(document.getElementById('percentage').value);

      if (isNaN(amount) || isNaN(percentage)) {
        alert('الرجاء إدخال المبلغ والنسبة المئوية بشكل صحيح');
        return;
      }

      const added = (amount * percentage) / 100;
      const total = amount + added;

      // عرض النتائج
      document.getElementById('addedValue').innerText = added.toFixed(2) + ' ر.س';
      document.getElementById('totalValue').innerText = total.toFixed(2) + ' ر.س';
      
      // إظهار كارت النتيجة
      document.getElementById('resultCard').classList.remove('hidden');
    }

    // دالة اختارها المستخدم لإرسال النتيجة فوراً للبوت وإغلاق الشاشة
    function sendDataToTelegram() {
      const added = document.getElementById('addedValue').innerText;
      const total = document.getElementById('totalValue').innerText;
      
      const data = {
        added: added,
        total: total,
        timestamp: new Date().toISOString()
      };

      if (tg && tg.sendData) {
        // إذا كان يفتح من داخل تليجرام
        tg.sendData(JSON.stringify(data));
      } else {
        // إذا كان يفتح من متصفح عالي لتجربة المعاينة
        alert('تمت المحاكاة! البيانات المرسلة:\n' + JSON.stringify(data, null, 2));
      }
    }
  </script>
</body>
</html>
