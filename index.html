#<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الساعي للكريبتو - حاسبة التوصيات</title>
    <!-- ربط مكتبة تليجرام الرسمية -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger-color: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .header p {
            margin: 5px 0 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .modes-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .mode-btn {
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
            border-color: var(--accent-color);
        }

        .custom-inputs {
            display: none;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 10px;
            border: 1px dashed var(--border-color);
            margin-bottom: 15px;
        }

        .custom-inputs.visible {
            display: block;
        }

        .custom-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .custom-row div {
            flex: 1;
        }

        .custom-row label {
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        .custom-row input {
            padding: 8px;
            font-size: 0.9rem;
        }

        .btn-calculate {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        .btn-calculate:hover {
            background: var(--accent-hover);
        }

        .result-section {
            margin-top: 20px;
            display: none;
        }

        textarea {
            width: 100%;
            height: 220px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #38bdf8;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            box-sizing: border-box;
            resize: none;
            direction: rtl;
            text-align: right;
            line-height: 1.4;
        }

        .btn-copy {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #059669;
        }

        /* شاشة الحظر للمستخدمين غير المصرح لهم */
        #auth-lock {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        #auth-lock h3 {
            color: var(--danger-color);
            margin-bottom: 10px;
        }

        #auth-lock p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container" id="app-container">
        <!-- شاشة التحقق والقفل -->
        <div id="auth-lock">
            <h3>⚠️ غير مصرح لك بالاستخدام</h3>
            <p>عذراً، هذا التطبيق مخصص لأعضاء محددين فقط.</p>
        </div>

        <!-- المحتوى الأساسي للتطبيق -->
        <div id="app-content">
            <div class="header">
                <h2>الساعي للكريبتو 🌟</h2>
                <p>حاسبة كليشة التوصيات الاحترافية</p>
            </div>

            <div class="form-group">
                <label>اسم العملة (مثال: BTC)</label>
                <input type="text" id="symbolInput" placeholder="BTC" value="BTC">
            </div>

            <div class="form-group">
                <label>سعر الدخول الأساسي</label>
                <input type="number" id="priceInput" placeholder="أدخل السعر هنا" step="any">
            </div>

            <div class="form-group">
                <label>نمط التوصية</label>
                <div class="modes-container">
                    <div class="mode-btn active" onclick="setMode('normal')">عادي</div>
                    <div class="mode-btn" onclick="setMode('high')">عالي</div>
                    <div class="mode-btn" onclick="setMode('custom')">مخصص</div>
                </div>
            </div>

            <!-- خيارات النسب المخصصة -->
            <div class="custom-inputs" id="customInputs">
                <div class="custom-row">
                    <div>
                        <label>الهدف 1 (%)</label>
                        <input type="number" id="c_t1" value="2.0" step="0.1">
                    </div>
                    <div>
                        <label>الهدف 2 (%)</label>
                        <input type="number" id="c_t2" value="4.0" step="0.1">
                    </div>
                </div>
                <div class="custom-row">
                    <div>
                        <label>الهدف 3 (%)</label>
                        <input type="number" id="c_t3" value="6.0" step="0.1">
                    </div>
                    <div>
                        <label>الهدف 4 (%)</label>
                        <input type="number" id="c_t4" value="10.0" step="0.1">
                    </div>
                </div>
                <div class="custom-row">
                    <div>
                        <label>الهدف الأخير (%)</label>
                        <input type="number" id="c_tl" value="15.0" step="0.1">
                    </div>
                    <div>
                        <label>إغلاق شمعة (%)</label>
                        <input type="number" id="c_sl_candle" value="-3.5" step="0.1">
                    </div>
                </div>
                <div class="custom-row">
                    <div>
                        <label>وقف لحظي (%)</label>
                        <input type="number" id="c_sl_instant" value="-5.0" step="0.1">
                    </div>
                </div>
            </div>

            <button class="btn-calculate" onclick="calculateSignal()">توليد الكليشة 🚀</button>

            <div class="result-section" id="resultSection">
                <textarea id="resultOutput" readonly></textarea>
                <button class="btn-copy" onclick="copyResult()">نسخ الكليشة 📋</button>
            </div>
        </div>
    </div>

    <script>
        // قائمة الأيدي المسموح لها بالاستخدام
        const allowedIds = ["8477440923", "7536915802", "8298463733"];

        // التحقق من صلاحية المستخدم عبر تليجرام
        window.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            tg.expand(); // تكبير التطبيق لملء الشاشة

            const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
            
            // إذا تم فتحه داخل تليجرام، نتحقق من الـ ID. (إذا تم فتحه من المتصفح العادي للمعاينة نسمح له بالعمل)
            if (user && user.id) {
                const chatId = user.id.toString();
                if (!allowedIds.includes(chatId)) {
                    document.getElementById('app-content').style.display = 'none';
                    document.getElementById('auth-lock').style.display = 'block';
                }
            }
        });

        let currentMode = 'normal';

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const customDiv = document.getElementById('customInputs');
            if (mode === 'custom') {
                customDiv.classList.add('visible');
            } else {
                customDiv.classList.remove('visible');
            }
        }

        function smartFormat(num) {
            if (num >= 1) {
                return num.toFixed(2);
            } else if (num < 1 && num >= 0.01) {
                return num.toFixed(4);
            } else {
                return num.toFixed(6);
            }
        }

        function calculateSignal() {
            const symbol = document.getElementById('symbolInput').value.trim().toUpperCase() || "BTC";
            const entryPrice = parseFloat(document.getElementById('priceInput').value);

            if (isNaN(entryPrice) || entryPrice <= 0) {
                alert("الرجاء إدخال سعر دخول صحيح!");
                return;
            }

            let p_t1, p_t2, p_t3, p_t4, p_tl, p_sl_c, p_sl_i;

            if (currentMode === 'normal') {
                p_t1 = 2.0; p_t2 = 4.0; p_t3 = 6.0; p_t4 = 10.0; p_tl = 15.0;
                p_sl_c = -3.5; p_sl_i = -5.0;
            } else if (currentMode === 'high') {
                p_t1 = 5.0; p_t2 = 10.0; p_t3 = 15.0; p_t4 = 20.0; p_tl = 30.0;
                p_sl_c = -5.0; p_sl_i = -7.0;
            } else {
                p_t1 = parseFloat(document.getElementById('c_t1').value) || 2.0;
                p_t2 = parseFloat(document.getElementById('c_t2').value) || 4.0;
                p_t3 = parseFloat(document.getElementById('c_t3').value) || 6.0;
                p_t4 = parseFloat(document.getElementById('c_t4').value) || 10.0;
                p_tl = parseFloat(document.getElementById('c_tl').value) || 15.0;
                p_sl_c = parseFloat(document.getElementById('c_sl_candle').value) || -3.5;
                p_sl_i = parseFloat(document.getElementById('c_sl_instant').value) || -5.0;
            }

            const entryMin = smartFormat(entryPrice * 0.99);
            const entryMax = smartFormat(entryPrice * 1.01);

            const t1 = smartFormat(entryPrice * (1 + p_t1 / 100));
            const t2 = smartFormat(entryPrice * (1 + p_t2 / 100));
            const t3 = smartFormat(entryPrice * (1 + p_t3 / 100));
            const t4 = smartFormat(entryPrice * (1 + p_t4 / 100));
            const tl = smartFormat(entryPrice * (1 + p_tl / 100));

            const sl_candle = smartFormat(entryPrice * (1 + p_sl_c / 100));
            const sl_instant = smartFormat(entryPrice * (1 + p_sl_i / 100));

            const response = `**ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ**\n` +
                             `      [الساعي للكريبتو ★★★ alsay_co](https://t.me/alsay_co/7)\n` +
                             `**ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ**\n\n` +
                             `🪙 العملة : \`${symbol}\`\n` +
                             `🕰 وقت الدخول : الآن \n` +
                             `🔷 منطقة الدخول : \`${entryMin}\` - \`${entryMax}\`\n\n` +
                             `ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ\n` +
                             `🎯 الاهداف :\n` +
                             `ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ\n` +
                             `🥉الهدف الاول  (+${p_t1}%) »» \`${t1}\`\n` +
                             `🥈 الهدف الثاني (+${p_t2}%) »» \`${t2}\`\n` +
                             `🥇 الهدف الثالث (+${p_t3}%) »» \`${t3}\`\n` +
                             `🏆 الهدف الرابع  (+${p_t4}%) »» \`${t4}\`\n` +
                             `🚀 الهدف الاخير (+${p_tl}%) »» \`${tl}\`\n\n` +
                             `ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ\n` +
                             `🚫 وقف الخسارة :\n` +
                             `ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ\n` +
                             `🕯 إغلاق شمعة 4H عند (${p_sl_c}%) »» \`${sl_candle}\`\n` +
                             `🚧 وقف خسارة لحظي (${p_sl_i}%) »» \`${sl_instant}\`\n\n` +
                             `**ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ**\n` +
                             `        **✨ نسأل الله التوفيق للجميع ✨**\n` +
                             `**ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ**`;

            document.getElementById('resultOutput').value = response;
            document.getElementById('resultSection').style.display = 'block';
        }

        function copyResult() {
            const outputBox = document.getElementById('resultOutput');
            outputBox.select();
            document.execCommand('copy');
            alert('تم نسخ الكليشة بنجاح! 📋');
        }
    </script>
</body>
</html>
